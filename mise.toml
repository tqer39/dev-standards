[settings]
# Windows でも依存関係の配置を npm 本体で解決する。
npm.package_manager = "npm"

[tools]
go = "1.27.4"
node = "26.13.1"
"npm:markdownlint-cli2" = "0.24.1"
"aqua:zizmorcore/zizmor" = "1.32.0"
"aqua:betterleaks/betterleaks" = "1.10.1"

[tasks.bootstrap]
run = "go mod download"

[tasks.lint]
run = ["go vet ./...", "markdownlint-cli2"]

[tasks.format]
run = "go fmt ./..."

[tasks."format:check"]
run = "go run ./cmd/dev-standards format-check"

[tasks.test]
run = "go test -timeout=20m ./..."

[tasks."test:race"]
# 複製先で検証一式を再実行する受け入れテストは、check の実行に任せる。
run = "go test -race -short ./..."

[tasks.build]
run = "go build -o bin/ ./cmd/dev-standards"

[tasks.check]
depends = ["lint", "format:check", "test", "build"]

[tasks."catalog:check"]
run = "go run ./cmd/dev-standards catalog"

[tasks."security:check"]
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks."security:actions"]
# self-repository（Low）はリポジトリ内の setup アクションの参照で、意図した構成なので medium 以上を見る。
run = "zizmor --offline --min-severity medium .github"

[tasks."security:secrets"]
# 過去の誤検知を拾わないよう、全履歴ではなく作業ツリーを検査する。
# 値をログに残さないよう伏せたうえで、検出したファイルと行を表示する。
run = "betterleaks dir --no-banner --verbose --redact ."

[tasks."session:verify"]
run = "go run ./cmd/dev-standards session-verify"

[tasks."standards:prepare"]
run = "go run ./cmd/dev-standards prepare"

[tasks."standards:finish"]
run = "go run ./cmd/dev-standards finish"
