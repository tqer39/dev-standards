{
  "schemaVersion": 1,
  "id": "CORE-GITIGNORE",
  "revision": 2,
  "status": "active",
  "title": "gitignore.io API で .gitignore を整備する",
  "rationale": "言語と OS に対応する除外設定を gitignore.io API から取得し、採用入力の保存と固有設定の保持によって再現可能にする。",
  "appliesTo": {
    "profiles": [
      "base"
    ]
  },
  "phases": [
    "adopt",
    "pr"
  ],
  "enforcement": {
    "level": "error",
    "waivable": false
  },
  "checks": [
    {
      "id": "configuration",
      "type": "builtin",
      "handler": "gitignore",
      "parameters": {}
    }
  ],
  "remediation": {
    "mode": "automatic",
    "handler": "managed-file",
    "instructions": "gitignore.io API から取得して保存した採用入力と .standards/gitignore.local を使って再生成する。変更計画を確認して適用し、check と verify、および再適用時の差分ゼロを確認する。"
  },
  "guidance": "guidance/core/gitignore.md",
  "references": [
    "https://docs.gitignore.io/use/api",
    "https://docs.gitignore.io/use/command-line"
  ]
}
