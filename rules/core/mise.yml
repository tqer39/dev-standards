{
  "schemaVersion": 1,
  "id": "CORE-MISE",
  "revision": 2,
  "status": "active",
  "title": "タスクの入口を mise に集約する",
  "rationale": "Go の版と共通タスク名を固定し、ローカルと CI が同じ入口を使用できるようにする。",
  "appliesTo": {
    "profiles": [
      "base"
    ]
  },
  "phases": [
    "adopt",
    "pr"
  ],
  "enforcement": {
    "level": "error",
    "waivable": false
  },
  "checks": [
    {
      "id": "configuration",
      "type": "builtin",
      "handler": "mise",
      "parameters": {}
    }
  ],
  "remediation": {
    "mode": "automatic",
    "handler": "managed-file",
    "instructions": "固有のツール設定は .standards/mise.project.toml、固有タスクは .standards/tasks.project.toml に記録し、計画を作り直して適用する。"
  },
  "guidance": "guidance/core/mise.md",
  "references": []
}
