{
  "schemaVersion": 1,
  "id": "CORE-MISE",
  "revision": 4,
  "status": "active",
  "title": "タスクの入口を mise に集約する",
  "rationale": "共通の開発手順を固定した実行系と成果物から再現し、宣言した版と実際に選択された子の実行系、ポリシーバンドルと CLI 実装、補助キャッシュと検査結果を区別する。",
  "appliesTo": {
    "profiles": [
      "base"
    ]
  },
  "phases": [
    "adopt",
    "pr"
  ],
  "enforcement": {
    "level": "error",
    "waivable": false
  },
  "checks": [
    {
      "id": "configuration",
      "type": "builtin",
      "handler": "mise",
      "parameters": {}
    }
  ],
  "remediation": {
    "mode": "automatic",
    "handler": "managed-file",
    "instructions": "計画を確認して適用し、check と verify で確認する。固定値だけから子の実行系を推定せず、バンドル値だけから CLI 実装の同一性を推定しない。実行系に依存するキャッシュの警告は、固定版、終了状態、検査結果、フォールバックの同等性を確認して判定する。"
  },
  "guidance": "guidance/core/mise.md",
  "references": []
}
