name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Windows は準備と engine のテストが遅く、短縮後も 3 分半ほどかかる。
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # 複製先で検証一式を再実行する受け入れテストは acceptance ジョブで並列に実行する。
      # main への push はキャッシュしたテスト結果を使わない。
      GOFLAGS: ${{ github.event_name != 'pull_request' && '-short -count=1' || '-short' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run check
      - if: runner.os != 'Windows'
        run: mise run test:race
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        # macOS と Windows ではこのテストだけで 4 分前後かかるため、PR では Ubuntu で確認し、
        # main への push で全 OS を確認する。
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOFLAGS: ${{ github.event_name != 'pull_request' && '-count=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - shell: bash
        run: mise exec -- go test -timeout=20m -run '^TestFleetUpdatesSourceAndProjectWithoutHumanApproval$' ./internal/automation
  workflow-result:
    if: always()
    needs: [check, acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHECK: ${{ needs.check.result }}
          ACCEPTANCE: ${{ needs.acceptance.result }}
        run: test "$CHECK" = success && test "$ACCEPTANCE" = success
