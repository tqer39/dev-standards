name: Setup
description: mise でツールを準備し、Go のビルドとモジュールのキャッシュを復元する。
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        version: 2026.10.20
    - id: go-env
      shell: bash
      run: |
        {
          echo "gocache=$(mise exec -- go env GOCACHE)"
          echo "gomodcache=$(mise exec -- go env GOMODCACHE)"
          echo "goversion=$(mise exec -- go env GOVERSION)"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.go-env.outputs.gocache }}
          ${{ steps.go-env.outputs.gomodcache }}
        key: go-${{ runner.os }}-${{ steps.go-env.outputs.goversion }}-${{ hashFiles('go.sum') }}
    # 同じキーでは保存し直さないので、5 日を超えた内容が Go の自動削除で失われないようにする。
    - shell: bash
      env:
        GOCACHE_DIR: ${{ steps.go-env.outputs.gocache }}
      run: |
        mkdir -p "$GOCACHE_DIR"
        date +%s > "$GOCACHE_DIR/trim.txt"
